version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: student-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studentadmin
      POSTGRES_PASSWORD: studentpass123
      POSTGRES_DB: student_tracker
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U studentadmin -d student_tracker" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #  adminer:
  #    image: adminer:latest
  #    container_name: student-tracker-adminer
  #    restart: unless-stopped
  #    ports:
  #      - "8080:8080"
  #    environment:
  #      ADMINER_DEFAULT_SERVER: postgres
  #    depends_on:
  #      - postgres

  # ---------------------------------------------------------------------------
  # ML Sub-Service — internal only, do NOT expose publicly
  # See backend/ml_service/README.md for trust model documentation.
  # ---------------------------------------------------------------------------
  ml_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    container_name: student-tracker-ml
    restart: unless-stopped
    ports:
      - "8001:8001" # local dev only; remove in production
    env_file:
      - backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      # GROQ_API_KEY is now loaded from env_file
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.7}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-1024}
      - GROQ_TIMEOUT_SEC=${GROQ_TIMEOUT_SEC:-10.0}
    # healthcheck is defined in Dockerfile.ml using Python urllib (curl not available in slim image)
    # No dependency on DB — the ML service is purely stateless inference

volumes:
  postgres_data:
    driver: local
