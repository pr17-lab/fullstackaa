# =============================================================================
# nginx.conf — Production configuration for the frontend container.
#
# Responsibilities:
#   1. Serve the static Vite build (React SPA)
#   2. Reverse-proxy /api/* → backend container (REST + WebSocket)
#   3. SPA fallback routing (React Router)
#   4. Security headers
#   5. Gzip compression
# =============================================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # Gzip compression for text assets
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Upstream — backend container
    # In Docker Compose / Railway service mesh the backend is reachable at
    # the service name "backend" on port 8000.
    # In Railway production, set BACKEND_URL as an nginx variable or use the
    # Railway internal hostname injected via environment substitution.
    # -------------------------------------------------------------------------
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ---------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------
        add_header X-Frame-Options           "SAMEORIGIN"            always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Max upload size (resume PDF uploads go through this proxy)
        client_max_body_size 16M;

        # ---------------------------------------------------------------------
        # Static assets — long cache with immutable for hashed filenames
        # Vite outputs files like /assets/index-aBcDeF12.js
        # ---------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---------------------------------------------------------------------
        # API Proxy — REST endpoints
        # Proxies all /api/* requests to the FastAPI backend.
        # Preserves headers needed by the backend (real IP, host, cookies).
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # Required for WebSocket upgrade (handled in sub-location below)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Pass real client info through Railway's proxy chain
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cookie forwarding (needed for HttpOnly JWT cookies)
            proxy_pass_header  Set-Cookie;
            proxy_cookie_path  / /;

            # Timeouts — generous for AI inference + long-lived WS connections
            proxy_connect_timeout  60s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;

            # Disable buffering for streaming/SSE responses
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ---------------------------------------------------------------------
        # WebSocket Proxy — upgrade handling
        # Any WS connection to /api/ws/* is handled here.
        # The map below sets $connection_upgrade correctly.
        # ---------------------------------------------------------------------
        location /api/ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;   # Keep WS alive for up to 24h
            proxy_send_timeout 86400s;
        }

        # ---------------------------------------------------------------------
        # SPA Routing — React Router fallback
        # Any path not matched above (no file, no /api) serves index.html.
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------
        # Deny access to hidden files (e.g. .env, .git)
        # ---------------------------------------------------------------------
        location ~ /\. {
            deny all;
        }
    }

    # Map HTTP Upgrade header → Connection header value
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ''        close;
    }
}
